name: Build Windows

# Baut den DoodleCraft-Launcher für Windows (NSIS-Setup + Portable) und legt die
# Artefakte ab. Bei einem Tag `v*` wird zusätzlich ein GitHub-Release erstellt.
on:
  push:
    branches:
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer & main
        run: npm run build

      - name: Package Windows (NSIS + Portable)
        run: npx electron-builder --win --publish never
        env:
          # Verhindert versehentliches Auto-Publishing durch electron-builder.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doodlecraft-launcher-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
