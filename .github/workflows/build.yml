name: Build

# Baut den DoodleCraft-Launcher für Windows (NSIS + Portable) und Linux
# (AppImage + deb) und legt die Artefakte ab. Bei einem Tag `v*` wird zusätzlich
# ein GitHub-Release mit allen Installern erstellt.
on:
  push:
    branches:
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            platform: linux
            artifact: linux
            files: |
              release/*.AppImage
              release/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer & main
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doodlecraft-launcher-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
