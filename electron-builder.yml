appId: com.doodlecraft.launcher
productName: DoodleCraft Launcher
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
linux:
  icon: resources/icon.png
  category: Game
  synopsis: Minecraft-Launcher im Drawing-Style
  target:
    - AppImage
